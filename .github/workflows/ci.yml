name: CI

# Development builds and tests run on macOS on the developer's machine
# (tools/macos/build-macos.sh); these Linux jobs only run when started by hand.
on:
  workflow_dispatch:

jobs:
  linux-gcc:
    name: Linux / GCC (Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1

      # Ubuntu 24.04 ships Qt 6.4; OpenCDC needs Qt >= 6.5.
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Configure
        run: cmake --preset linux-gcc-ci

      - name: Build
        run: cmake --build --preset linux-gcc-ci-release --parallel

      - name: Test
        run: ctest --preset linux-gcc-ci-release

      - name: VHDL corpus (pinned open-source projects)
        run: tools/ci/vhdl-corpus.sh build/linux-gcc-ci/bin/Release "${{ runner.temp }}/vhdl-corpus"

      - name: SystemVerilog corpus (pinned open-source projects)
        run: tools/ci/sv-corpus.sh build/linux-gcc-ci/bin/Release "${{ runner.temp }}/sv-corpus"

      - name: Package
        run: cpack --config build/linux-gcc-ci/CPackConfig.cmake -C Release -B dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenCDC-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.deb

  linux-sanitize:
    name: Linux / GCC / ASan+UBSan+checked STL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset linux-gcc-sanitize

      - name: Build
        run: cmake --build --preset linux-gcc-sanitize --parallel 2

      - name: Test
        run: ctest --preset linux-gcc-sanitize --parallel 2

  linux-clang:
    name: Linux / Clang 18 (Debug, warnings as errors, no GUI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18

      - name: Configure
        run: cmake --preset linux-clang -DCMAKE_CXX_COMPILER=clang++-18 -DOPENCDC_WARNINGS_AS_ERRORS=ON -DOPENCDC_BUILD_GUI=OFF

      - name: Build
        run: cmake --build --preset linux-clang-debug --parallel

      - name: Test
        run: ctest --preset linux-clang-debug
