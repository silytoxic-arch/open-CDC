name: CI

# Only the Windows version is built here (on each push to main, or when started by hand).
on:
  push:
    branches: [main]
  workflow_dispatch:

# a newer push cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows x64 / VS2022 (${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        run: cmake --preset windows-msvc-ci

      - name: Build
        run: cmake --build --preset windows-msvc-ci-${{ matrix.config == 'Debug' && 'debug' || 'release' }} --parallel

      - name: Test
        run: ctest --preset windows-msvc-ci-${{ matrix.config == 'Debug' && 'debug' || 'release' }}

      - name: Package (Release)
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          # NSIS is preinstalled on the runner image but not on PATH.
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path "$nsis\makensis.exe") { $env:PATH = "$nsis;$env:PATH" }
          # Re-configure so that Packaging.cmake finds makensis.
          cmake --preset windows-msvc-ci
          cpack --config build/windows-msvc-ci/CPackConfig.cmake -C Release -B dist

      - name: Upload packages
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: OpenCDC-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
